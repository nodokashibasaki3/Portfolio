<style>
    /* Blog posts: a simple top bar, one centered column, and a small footer.
       Fonts and colors come from the homepage theme. */

    /* The theme pads <body> on small screens; posts handle their own gutters. */
    body.blog {
        padding: 0;
    }

    .blog-wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 0 30px;
    }

    .blog-topbar {
        border-top: 4px solid #232F3E;
        border-bottom: 1px solid #e8e8e8;
    }

    .blog-topbar-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 56px;
    }

    .blog-site-title,
    .blog-site-title:hover {
        color: #232F3E;
        font-size: 22px;
    }

    .blog-nav a {
        margin-left: 20px;
        color: #777;
    }

    .blog-nav a:hover {
        color: #FF7900;
    }

    .post {
        font-size: 18px;
        line-height: 1.65;
        padding: 44px 0 20px;
    }

    .post-header {
        margin-bottom: 36px;
    }

    .post-title {
        font-size: 36px;
        font-weight: 400;
        line-height: 1.15;
        margin: 0 0 8px;
    }

    .post-date {
        color: #999;
        font-size: 15px;
    }

    .post-tldr {
        font-style: italic;
    }

    .post h2,
    .post h3,
    .post h4 {
        font-weight: 500;
        line-height: 1.2;
    }

    .post h2 {
        font-size: 28px;
        margin: 48px 0 14px;
    }

    .post h3 {
        font-size: 22px;
        margin: 34px 0 10px;
    }

    .post h4 {
        font-size: 18px;
        margin: 24px 0 8px;
    }

    .post p,
    .post ul,
    .post ol,
    .post pre,
    .post table {
        margin-bottom: 18px;
    }

    .post li > ul,
    .post li > ol {
        margin: 2px 0 0;
    }

    .post code {
        font-size: 0.82em;
    }

    /* Inline code gets its own color, distinct from body text and orange links. */
    .post :not(pre) > code {
        color: #3b6ea5;
    }

    .post pre {
        max-width: none;
        line-height: 1.45;
        background: #fafafa;
        border-color: #eee;
    }

    .post img {
        display: block;
        margin: 28px auto;
        border-radius: 4px;
    }

    .post hr {
        margin: 40px 0;
        background: #e5e5e5;
    }

    .post blockquote {
        color: #777;
        border-left-color: #ddd;
        margin-bottom: 18px;
    }

    .post blockquote > :last-child {
        margin-bottom: 0;
    }

    /* Callouts: a light gray box with the icon on the left. */
    .post .callout {
        display: flex;
        gap: 12px;
        background: #f7f6f3;
        border-radius: 5px;
        padding: 14px 18px;
        margin: 0 0 18px;
    }

    .post .callout-icon {
        flex-shrink: 0;
    }

    .post .callout-icon .favicon {
        display: inline-block;
        width: 16px;
        height: 16px;
        margin: 6px 0 0;
        border-radius: 3px;
        vertical-align: top;
    }

    .post .callout-body {
        min-width: 0;
        flex: 1;
    }

    .post .callout-body > :last-child {
        margin-bottom: 0;
    }

    .post details {
        margin: 0 0 18px;
    }

    .post summary {
        cursor: pointer;
        color: #232F3E;
    }

    .post details[open] summary {
        margin-bottom: 10px;
    }

    .post table {
        font-size: 0.9em;
    }

    .post #markdown-toc {
        padding-left: 20px;
    }

    .blog-footer {
        border-top: 1px solid #e8e8e8;
        padding: 28px 0 40px;
        font-size: 15px;
    }

    .blog-footer-inner {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .blog-footer-inner > a {
        color: #777;
    }

    .blog-footer-links a {
        margin-left: 14px;
    }

    @media screen and (max-width: 600px) {
        .blog-wrap {
            padding: 0 16px;
        }

        .post-title {
            font-size: 30px;
        }
    }
</style>
