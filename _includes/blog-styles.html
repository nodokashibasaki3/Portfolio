<style>
    /* Blog posts: inherit the homepage's fonts and colors; only adjust what long-form posts need. */

    /* Posts hide the sidebar, so center the content column instead of floating it right. */
    .no-sidebar section {
        float: none;
        margin: 0 auto;
    }

    .post-header {
        margin-bottom: 32px;
    }

    .post-title {
        margin: 0 0 6px;
    }

    .post-date {
        color: #999;
    }

    .post-tldr {
        font-style: italic;
    }

    .post h2 {
        margin: 40px 0 14px;
    }

    .post h3,
    .post h4 {
        margin: 28px 0 12px;
    }

    .post h3 {
        font-size: 1.2em;
    }

    .post h4 {
        font-size: 1.05em;
    }

    .post li {
        margin-bottom: 4px;
    }

    .post li > ul,
    .post li > ol {
        margin: 4px 0 0;
    }

    .post code {
        font-size: 0.85em;
    }

    .post :not(pre) > code {
        background: #f6f6f6;
        padding: 1px 5px;
        border-radius: 3px;
    }

    .post pre {
        max-width: none;
        line-height: 1.4;
    }

    .post img {
        display: block;
        margin: 24px auto;
        border: 1px solid #eee;
        border-radius: 5px;
    }

    .post hr {
        margin: 36px 0;
    }

    .post .callout {
        display: flex;
        gap: 12px;
        background: #f7f6f3;
        border-radius: 5px;
        padding: 14px 18px;
        margin: 0 0 20px;
    }

    .post .callout-icon {
        flex-shrink: 0;
        line-height: 1.5;
    }

    /* Override the generic post image style (border, margin) for small site icons. */
    .post .callout-icon .favicon {
        display: inline-block;
        width: 18px;
        height: 18px;
        margin: 3px 0 0;
        border: 0;
        border-radius: 3px;
        vertical-align: top;
    }

    .post .callout-body {
        min-width: 0;
        flex: 1;
    }

    .post .callout-body > :last-child {
        margin-bottom: 0;
    }

    .post details {
        margin: 0 0 20px;
    }

    .post summary {
        cursor: pointer;
        color: #232F3E;
        font-weight: 500;
        margin-bottom: 10px;
    }

    .post table {
        font-size: 0.95em;
    }

    .post #markdown-toc {
        padding-left: 20px;
    }

    .post-footer {
        margin-top: 48px;
        padding-top: 16px;
        border-top: 1px solid #e5e5e5;
    }
</style>
