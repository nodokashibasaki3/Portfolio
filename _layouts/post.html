---
layout: homepage
---

{% include blog-styles.html %}

{% comment %}
  Use divs, not <header>/<footer>: the theme styles those tags as the fixed sidebar.
{% endcomment %}
<article class="post">
    <div class="post-header">
        <h1 class="post-title">{{ page.title }}</h1>
        <time class="post-date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    </div>

    {% if page.tldr %}
    <p class="post-tldr">{{ page.tldr }}</p>
    {% endif %}

    {{ content }}

    <div class="post-footer">
        <a href="{{ '/' | relative_url }}#blog">← Back to home</a>
    </div>
</article>
